<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 80" width="480" height="80">
  <defs>
    <linearGradient id="grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#F9A326"/>
      <stop offset="30%"  stop-color="#E1306C"/>
      <stop offset="65%"  stop-color="#833AB4"/>
      <stop offset="100%" stop-color="#405DE6"/>
    </linearGradient>
    <linearGradient id="gradVip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#F9A326"/>
      <stop offset="40%"  stop-color="#E1306C"/>
      <stop offset="80%"  stop-color="#833AB4"/>
      <stop offset="100%" stop-color="#405DE6"/>
    </linearGradient>
    <mask id="vipMask">
      <text x="388" y="56" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-1" fill="white">vip</text>
    </mask>
  </defs>

  <!-- Ícone círculo -->
  <circle cx="40" cy="40" r="38" fill="url(#grad)"/>
  <circle cx="40" cy="40" r="35" fill="none" stroke="white" stroke-width="2.8"/>
  <circle cx="40" cy="40" r="33.5" fill="url(#grad)"/>
  <polyline points="22,40 33,53 58,24"
    fill="none" stroke="white" stroke-width="7"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- "achadocerto" escuro -->
  <text x="92" y="56"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="38"
    font-weight="700"
    letter-spacing="-1"
    fill="#1a1a2e">achadocerto</text>

  <!-- "vip" colado, em degradê -->
  <rect x="386" y="18" width="88" height="46" fill="url(#gradVip)" mask="url(#vipMask)"/>
</svg>