<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 60" width="340" height="60">
  <defs>
    <linearGradient id="gradIcon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#F9A326"/>
      <stop offset="30%"  stop-color="#E1306C"/>
      <stop offset="65%"  stop-color="#833AB4"/>
      <stop offset="100%" stop-color="#405DE6"/>
    </linearGradient>
    <linearGradient id="gradVip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#E1306C"/>
      <stop offset="50%"  stop-color="#833AB4"/>
      <stop offset="100%" stop-color="#405DE6"/>
    </linearGradient>
    <mask id="vipMask">
      <text x="218" y="43"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="28"
        font-weight="800"
        letter-spacing="0.5"
        fill="white">vip</text>
    </mask>
  </defs>

  <!-- Ícone -->
  <circle cx="30" cy="30" r="29" fill="url(#gradIcon)"/>
  <circle cx="30" cy="30" r="26.5" fill="none" stroke="white" stroke-width="2.5"/>
  <circle cx="30" cy="30" r="25" fill="url(#gradIcon)"/>
  <polyline points="16,30 25,41 44,17"
    fill="none" stroke="white" stroke-width="5.5"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- "achadocerto" cinza escuro peso 600 -->
  <text x="70" y="43"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="28"
    font-weight="600"
    letter-spacing="-0.5"
    fill="#2d2d2d">achadocerto</text>

  <!-- "vip" colado, degradê, peso 800 -->
  <rect x="216" y="14" width="80" height="36" fill="url(#gradVip)" mask="url(#vipMask)"/>
</svg>