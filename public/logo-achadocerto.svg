<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="1100" height="280">
  <!-- Background transparente -->
  <rect width="1100" height="280" fill="none"/>

  <!-- Texto "Achad" em navy bold -->
  <text x="30" y="200" font-family="Arial Black, Arial, sans-serif" font-size="150" font-weight="900" fill="#142864" letter-spacing="-3">Achad</text>

  <!-- Lupa no lugar do "o" -->
  <!-- Círculo externo da lupa (outline luminoso) -->
  <circle cx="617" cy="135" r="54" fill="none" stroke="#1F90FF" stroke-width="13"/>
  <!-- Reflexo dentro da lupa -->
  <circle cx="602" cy="108" r="12" fill="#1F90FF" opacity="0.18"/>
  <!-- Cabo da lupa -->
  <line x1="655" y1="173" x2="720" y2="238" stroke="#1F90FF" stroke-width="14" stroke-linecap="round"/>

  <!-- Texto "Certo" em navy bold -->
  <text x="730" y="200" font-family="Arial Black, Arial, sans-serif" font-size="150" font-weight="900" fill="#142864" letter-spacing="-3">Certo</text>

  <!-- Badge VIP -->
  <rect x="1020" y="60" width="60" height="155" rx="10" ry="10" fill="#142864" stroke="#D4AF37" stroke-width="3"/>
  <!-- Letras V I P verticais -->
  <text x="1050" y="118" font-family="Arial Black, Arial, sans-serif" font-size="28" font-weight="900" fill="#D4AF37" text-anchor="middle">V</text>
  <text x="1050" y="152" font-family="Arial Black, Arial, sans-serif" font-size="28" font-weight="900" fill="#D4AF37" text-anchor="middle">I</text>
  <text x="1050" y="186" font-family="Arial Black, Arial, sans-serif" font-size="28" font-weight="900" fill="#D4AF37" text-anchor="middle">P</text>
</svg>