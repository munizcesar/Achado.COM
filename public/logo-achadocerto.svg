<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <!-- Fundo transparente -->
  <rect width="900" height="280" fill="white" opacity="0"/>

  <!-- === LUPA === -->
  <!-- Círculo externo da lupa -->
  <circle cx="110" cy="120" r="72" fill="white" stroke="#142864" stroke-width="14"/>

  <!-- Cabo da lupa (navy, arredondado, inclinado para baixo-esquerda) -->
  <line x1="58" y1="175" x2="18" y2="245" stroke="#142864" stroke-width="18" stroke-linecap="round"/>

  <!-- Check dourado dentro da lupa -->
  <!-- Traço esquerdo do check -->
  <polyline
    points="68,125 98,158 155,88"
    fill="none"
    stroke="#D4AF37"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Ponta do check saindo da lupa para cima (spike) -->
  <line x1="155" y1="88" x2="170" y2="42" stroke="#D4AF37" stroke-width="10" stroke-linecap="round"/>

  <!-- === TEXTO === -->
  <!-- "AchadoCerto" grande e bold -->
  <text
    x="220" y="155"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-size="118"
    font-weight="900"
    fill="#142864"
    letter-spacing="-2"
  >AchadoCerto</text>

  <!-- Linha divisória fina -->
  <line x1="220" y1="172" x2="888" y2="172" stroke="#142864" stroke-width="2" opacity="0.4"/>

  <!-- "VIP" dourado centralizado abaixo -->
  <text
    x="554" y="240"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-size="70"
    font-weight="900"
    fill="#D4AF37"
    text-anchor="middle"
    letter-spacing="12"
  >VIP</text>
</svg>