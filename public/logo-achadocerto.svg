<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 80" width="520" height="80">
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1150"/>
      <stop offset="100%" stop-color="#2e1155"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e1150"/>
      <stop offset="60%" stop-color="#2e1155"/>
    </linearGradient>
  </defs>

  <!-- Pill icon fundo roxo -->
  <rect x="0" y="6" width="68" height="68" rx="18" fill="url(#iconBg)"/>

  <!-- Lupa branca -->
  <circle cx="28" cy="34" r="13" fill="none" stroke="white" stroke-width="4"/>
  <!-- Cabo laranja/rosa -->
  <line x1="37" y1="43" x2="50" y2="56" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
  <!-- Check laranja/rosa -->
  <polyline points="20,34 26,40 36,26" fill="none" stroke="#ec4899" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AchadoCerto em roxo escuro -->
  <text x="82" y="54" font-family="'Segoe UI Black','Arial Black',Arial,sans-serif" font-size="40" font-weight="900" fill="url(#textGrad)" letter-spacing="-1">AchadoCerto</text>

  <!-- VIP em gradiente laranja/rosa -->
  <text x="383" y="54" font-family="'Segoe UI Black','Arial Black',Arial,sans-serif" font-size="40" font-weight="900" fill="url(#goldGrad)" letter-spacing="-1">VIP</text>
</svg>