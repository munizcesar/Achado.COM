<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Círculo externo -->
  <circle cx="45" cy="45" r="40" stroke="#1A56DB" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Círculo médio -->
  <circle cx="45" cy="45" r="28" stroke="#1A56DB" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Círculo interno -->
  <circle cx="45" cy="45" r="17" stroke="#1A56DB" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Lente da lupa -->
  <circle cx="45" cy="45" r="10" stroke="#1342A8" stroke-width="4" stroke-linecap="round"/>
  <!-- Reflexo dentro da lente -->
  <path d="M40 41 Q42 39 45 40" stroke="#1A56DB" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Cabo da lupa (diagonal para baixo-direita) -->
  <line x1="53" y1="53" x2="65" y2="65" stroke="#1342A8" stroke-width="5" stroke-linecap="round"/>
</svg>