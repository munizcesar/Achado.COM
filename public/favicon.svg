<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fundo navy arredondado -->
  <rect width="64" height="64" rx="14" ry="14" fill="#142864"/>

  <!-- Círculo da lupa -->
  <circle cx="27" cy="26" r="14" fill="none" stroke="#4CA9FF" stroke-width="5"/>

  <!-- Cabo da lupa -->
  <line x1="17" y1="37" x2="10" y2="48" stroke="#4CA9FF" stroke-width="5" stroke-linecap="round"/>

  <!-- Check dourado dentro da lupa -->
  <polyline
    points="19,26 25,33 36,18"
    fill="none"
    stroke="#D4AF37"
    stroke-width="3.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Spike dourado saindo da lupa -->
  <line x1="36" y1="18" x2="41" y2="11" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
</svg>