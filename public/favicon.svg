<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Degrade principal: azul claro -> azul médio -> azul escuro -->
    <linearGradient id="grad" x1="5" y1="5" x2="95" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#7AB3F7"/>
      <stop offset="40%"  stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0A2472"/>
    </linearGradient>
    <!-- Degrade cabo: azul forte -> navy -->
    <linearGradient id="gradCabo" x1="50" y1="50" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1A56DB"/>
      <stop offset="100%" stop-color="#061140"/>
    </linearGradient>
  </defs>

  <!-- Círculo externo (azul claro) -->
  <circle cx="44" cy="44" r="39" stroke="url(#grad)" stroke-width="3.2"/>

  <!-- Círculo médio (azul médio) -->
  <circle cx="44" cy="44" r="28" stroke="url(#grad)" stroke-width="3.5"/>

  <!-- LISTRA BRANCA divisória entre médio e interno -->
  <circle cx="44" cy="44" r="22" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- Círculo interno (azul forte) -->
  <circle cx="44" cy="44" r="16" stroke="url(#grad)" stroke-width="4"/>

  <!-- Lente da lupa (navy) -->
  <circle cx="44" cy="44" r="9.5" stroke="#0A2472" stroke-width="5"/>

  <!-- Reflexo interno na lente -->
  <path d="M39.5 40.5 Q41.5 38.5 44.5 39.5" stroke="#7AB3F7" stroke-width="2" stroke-linecap="round"/>

  <!-- Cabo com degrade, mais longo e grosso -->
  <line x1="51" y1="51" x2="70" y2="70" stroke="url(#gradCabo)" stroke-width="7" stroke-linecap="round"/>
</svg>