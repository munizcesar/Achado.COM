<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente vibrante (laranja/rosa/roxo/azul) -->
    <linearGradient id="checkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#FF3D7F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E64398;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#8B5DFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90E2;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradiente para a borda -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#8B5DFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E64398;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#FF3D7F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B35;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Círculo de fundo com gradiente -->
  <circle cx="256" cy="256" r="256" fill="url(#checkGradient)"/>
  
  <!-- Borda circular branca interna -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#FFFFFF" stroke-width="24"/>
  
  <!-- Check mark branco (✓) -->
  <path 
    d="M 160,256 L 220,320 L 360,180" 
    fill="none" 
    stroke="#FFFFFF" 
    stroke-width="56" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />
</svg>