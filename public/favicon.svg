<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">

  <!-- Fundo branco em todo o alvo -->
  <circle cx="44" cy="44" r="39" fill="white"/>

  <!-- Circulo externo - azul claro -->
  <circle cx="44" cy="44" r="39" stroke="#7AB3F7" stroke-width="8" fill="none"/>

  <!-- Circulo medio - azul medio -->
  <circle cx="44" cy="44" r="28" stroke="#2563EB" stroke-width="9" fill="none"/>

  <!-- Anel branco divisorio -->
  <circle cx="44" cy="44" r="22" stroke="#FFFFFF" stroke-width="8" fill="none"/>

  <!-- Circulo interno - azul forte -->
  <circle cx="44" cy="44" r="16" stroke="#1342A8" stroke-width="10" fill="none"/>

  <!-- Lente da lupa - PRETA com centro BRANCO -->
  <circle cx="44" cy="44" r="9.5" fill="white"/>
  <circle cx="44" cy="44" r="9.5" stroke="#111111" stroke-width="12" fill="none"/>

  <!-- Cabo PRETO - saindo alem da borda -->
  <line x1="51" y1="51" x2="80" y2="80" stroke="#111111" stroke-width="15" stroke-linecap="round"/>

</svg>