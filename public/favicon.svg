<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">

  <!-- Anel externo - azul claro, grosso -->
  <circle cx="42" cy="42" r="34" stroke="#60A5FA" stroke-width="9" fill="none"/>

  <!-- Anel interno - azul escuro, grosso -->
  <circle cx="42" cy="42" r="20" stroke="#1D4ED8" stroke-width="9" fill="none"/>

  <!-- Lente - preta com centro branco -->
  <circle cx="42" cy="42" r="10" fill="white"/>
  <circle cx="42" cy="42" r="10" stroke="#111111" stroke-width="11" fill="none"/>

  <!-- Cabo - preto grosso saindo alem da borda -->
  <line x1="50" y1="52" x2="78" y2="78" stroke="#111111" stroke-width="16" stroke-linecap="round"/>

</svg>