<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fundo arredondado navy -->
  <rect width="64" height="64" rx="14" ry="14" fill="#142864"/>

  <!-- Círculo da lupa (branco) -->
  <circle cx="26" cy="25" r="13" fill="none" stroke="#1F90FF" stroke-width="5"/>
  <!-- Brilho interno da lupa -->
  <circle cx="21" cy="19" r="4" fill="white" opacity="0.2"/>

  <!-- Cabo da lupa -->
  <line x1="35" y1="34" x2="47" y2="47" stroke="#1F90FF" stroke-width="5" stroke-linecap="round"/>

  <!-- Ponto de check/visto dentro da lupa (simboliza "achado certo") -->
  <polyline points="19,25 24,30 33,18" fill="none" stroke="#D4AF37" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>