# ────────────────────────────────────────────────────
# Agente Autônomo — AchadoCerto.VIP
# Fonte de produtos: Amazon BR (API oficial)
# Mercado Livre: manual (sem integração automática)
#
# Horários BRT (UTC-3):
#   08:00 BRT = 11:00 UTC
#   12:00 BRT = 15:00 UTC
#   18:00 BRT = 21:00 UTC
#
# Secrets necessários (Settings → Secrets → Actions):
#   GROQ_API_KEY          ← IA geradora do post
#   SERPER_API_KEY         ← busca Google (opcional)
#   AMAZON_AFFILIATE_TAG   ← sua tag Amazon Associados BR
# ────────────────────────────────────────────────────

name: "🤖 Agente Posts AchadoCerto.VIP"

on:
  schedule:
    - cron: '0 11 * * *'   # 08:00 BRT
    - cron: '0 15 * * *'   # 12:00 BRT
    - cron: '0 21 * * *'   # 18:00 BRT
  workflow_dispatch:
    inputs:
      pillar:
        description: 'Pilar específico (opcional)'
        required: false
        type: string
        default: 'auto'

jobs:
  gerar-post:
    name: "📝 Gerar post (Amazon BR)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:

      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "⚡ Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: "📦 Instalar dependências"
        run: npm ci

      # Restaura o histórico entre runs (evita repetir produtos)
      - name: "💾 Restaurar histórico de posts"
        uses: actions/cache@v4
        with:
          path: scripts/agent/history.json
          key: agent-history-${{ github.run_id }}
          restore-keys: |
            agent-history-

      # Monta backend/.env sem espaços antes das variáveis
      - name: "🔐 Montar backend/.env"
        run: |
          mkdir -p backend
          cat > backend/.env << 'ENVEOF'
GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
GROQ_MODEL=llama-3.3-70b-versatile
GROQ_TEMPERATURE=0.1
SERPER_API_KEY=${{ secrets.SERPER_API_KEY }}
AMAZON_AFFILIATE_TAG=${{ secrets.AMAZON_AFFILIATE_TAG }}
NODE_ENV=production
ENVEOF
          echo "✅ backend/.env criado"

      # Roda o agente — só busca produtos na Amazon BR
      - name: "🤖 Rodar agente"
        run: |
          PILLAR="${{ github.event.inputs.pillar }}"
          if [ -n "$PILLAR" ] && [ "$PILLAR" != "auto" ]; then
            echo "🏷️  Pilar forçado: $PILLAR"
            node scripts/agent/agent.js --now --source amazon $PILLAR
          else
            echo "🔄 Rotação automática entre pilares"
            node scripts/agent/agent.js --now --source amazon
          fi
        env:
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          SERPER_API_KEY:       ${{ secrets.SERPER_API_KEY }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}

      # Commit apenas se o agente gerou algum arquivo novo
      - name: "📤 Commit + Push do post"
        run: |
          git config user.name  "Agente AchadoCerto"
          git config user.email "agente@achadocerto.vip"

          git add src/content/ scripts/agent/history.json 2>/dev/null || true
          git add -A

          if git diff --staged --quiet; then
            echo "⚠️  Nenhum post novo gerado nesta execução"
            exit 0
          fi

          TIMESTAMP=$(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M BRT')
          git commit -m "post: artigo Amazon BR gerado pelo agente [$TIMESTAMP]"
          git push origin main
          echo "✅ Post publicado — Cloudflare Pages rebuild iniciado"

      # Resumo visível pelo celular em github.com/.../actions
      - name: "📊 Resumo"
        if: always()
        run: |
          echo "## 🤖 Agente AchadoCerto.VIP" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| ⏰ Horário | $(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M BRT') |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏷️  Pilar | ${{ github.event.inputs.pillar || 'automático' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛠️  Fonte | Amazon BR (ML: manual) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔥 Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          if [ -f scripts/agent/agent.log ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📝 Log do agente" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -20 scripts/agent/agent.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
