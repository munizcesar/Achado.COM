name: "🤖 Agente Posts AchadoCerto.VIP"

on:
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 15 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  gerar-post:
    name: "📝 Gerar post (Amazon BR)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "⚡ Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: "📦 Instalar dependências"
        run: npm ci

      - name: "💾 Restaurar histórico de posts"
        uses: actions/cache@v4
        with:
          path: scripts/agent/history.json
          key: agent-history-${{ github.run_id }}
          restore-keys: |
            agent-history-

      - name: "🔐 Montar backend/.env"
        run: |
          mkdir -p backend
          cat > backend/.env << 'ENVEOF'
GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
GROQ_MODEL=llama-3.3-70b-versatile
GROQ_TEMPERATURE=0.1
SERPER_API_KEY=${{ secrets.SERPER_API_KEY }}
AMAZON_AFFILIATE_TAG=${{ secrets.AMAZON_AFFILIATE_TAG }}
AMAZON_CREDENTIAL_ID=${{ secrets.AMAZON_CREDENTIAL_ID }}
NODE_ENV=production
ENVEOF
          echo "✅ backend/.env criado"

      - name: "🤖 Rodar agente"
        run: |
          echo "🔄 Rotação automática entre pilares"
          node scripts/agent/agent.js --now --source amazon
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
          AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}

      - name: "📤 Commit + Push do post"
        run: |
          git config user.name "Agente AchadoCerto"
          git config user.email "agente@achadocerto.vip"

          git add src/content/ scripts/agent/history.json 2>/dev/null || true
          git add -A

          if git diff --staged --quiet; then
            echo "⚠️  Nenhum post novo gerado nesta execução"
            exit 0
          fi

          TIMESTAMP=$(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M BRT')
          git commit -m "post: artigo Amazon BR gerado pelo agente [$TIMESTAMP]"
          git push origin main
          echo "✅ Post publicado"

      - name: "📊 Resumo"
        if: always()
        run: |
          echo "## 🤖 Agente AchadoCerto.VIP" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| ⏰ Horário | $(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M BRT') |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏷️  Pilar | automático |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛠️  Fonte | Amazon BR (ML: manual) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔥 Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          if [ -f scripts/agent/agent.log ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📝 Log do agente" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -20 scripts/agent/agent.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
