            </button>
        </form>
        
        <button id="mobile-search-toggle" class="mobile-only" style="background: transparent; border: none; color: #D4AF37; font-size: 20px; cursor: pointer; flex-shrink: 0; display: block;">
            <i class="fas fa-search"></i>
        </button>
    </div>
</header>

<script>
// Controle ULTRA agressivo - força esconder/mostrar fisicamente
(function() {
    const searchForm = document.getElementById('main-search-form');
    const toggleBtn = document.getElementById('mobile-search-toggle');
    
    function updateVisibility() {
        const isMobile = window.innerWidth <= 768;
        
        if (isMobile) {
            // Mobile: form FORA DA TELA
            searchForm.style.position = 'absolute';
            searchForm.style.top = '-9999px';
            searchForm.style.left = '-9999px';
            searchForm.style.opacity = '0';
            searchForm.style.pointerEvents = 'none';
            searchForm.style.display = 'none';
            toggleBtn.style.display = 'block';
            toggleBtn.style.position = 'relative';
        } else {
            // Desktop: form VISÍVEL normalmente
            searchForm.style.position = 'relative';
            searchForm.style.top = 'auto';
            searchForm.style.left = 'auto';
            searchForm.style.opacity = '1';
            searchForm.style.pointerEvents = 'auto';
            searchForm.style.display = 'flex';
            searchForm.style.alignItems = 'center';
            toggleBtn.style.display = 'none';
        }
    }
    
    // Executa IMEDIATAMENTE
    updateVisibility();
    
    // Força execução após 10ms (caso ainda não tenha carregado)
    setTimeout(updateVisibility, 10);
    
    // Atualiza ao redimensionar
    window.addEventListener('resize', updateVisibility);
})();
</script>
