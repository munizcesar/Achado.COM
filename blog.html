<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog de Matérias | AchadoCerto.VIP</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <style>
        /* Reset básico */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        body { background-color: #050505; color: #FFF; }

        /* --- Header / Topo --- */
        .topo {
            background: #090122;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1A1F71;
            flex-wrap: wrap;
            gap: 15px;
        }
        .topo h1 { font-size: 20px; color: #FFF; }
        .achado { color: #FFF; }
        .vip { color: #FFD700; }

        /* Search Input */
        #search-input {
            padding: 10px 15px;
            border: 2px solid #1A1F71;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
            width: 100%;
            max-width: 300px;
            outline: none;
            transition: all 0.3s ease;
        }
        #search-input::placeholder { color: rgba(255, 255, 255, 0.6); }
        #search-input:focus { border-color: #FFD700; box-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }

        /* --- Título da Página --- */
        .blog-header { text-align: center; padding: 40px 20px; background: #090122; }
        .blog-header h2 { color: #FFD700; font-size: 28px; text-transform: uppercase; margin-bottom: 10px; }
        
        /* --- Grid Principal --- */
        .container-principal {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .blog-grid { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 20px; 
            margin-bottom: 40px;
        }

        /* --- Cards dos Posts --- */
        .post-card { 
            background: #080808; 
            border: 1px solid #1A1F71; 
            border-radius: 15px; 
            overflow: hidden; 
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            text-decoration: none;
        }

        .post-card:hover { transform: translateY(-5px); border-color: #FFD700; box-shadow: 0 5px 15px rgba(255, 215, 0, 0.1); }
        
        .post-card img { width: 100%; height: 200px; object-fit: cover; }
        
        .post-info { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        
        .tag { 
            display: inline-block; 
            padding: 4px 10px; 
            border-radius: 4px; 
            font-size: 12px; 
            font-weight: bold; 
            margin-bottom: 10px;
            width: fit-content;
        }
        .tag-eletronicos { background: #1A1F71; color: #FFF; }
        .tag-guia { background: #228B22; color: #FFF; }
        .tag-casa { background: #e67e22; color: #FFF; }

        .post-info h3 { color: #FFD700; margin-bottom: 10px; font-size: 20px; line-height: 1.4; }
        .post-info p { color: #CCC; font-size: 14px; margin-bottom: 20px; flex-grow: 1; }
        
        .card-link { 
            color: #FFD700; 
            font-weight: bold; 
            font-size: 14px; 
            margin-top: auto; 
            display: block; 
        }

        /* --- Banner VIP (WhatsApp) --- */
        .banner-inline-vip {
            grid-column: 1 / -1; /* Ocupa toda a largura em mobile se precisar */
            background: linear-gradient(45deg, #075E54, #128C7E);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #FFF;
            border: 1px solid #25D366;
        }
        .banner-content { display: flex; align-items: center; gap: 20px; width: 100%; justify-content: space-between; flex-wrap: wrap; }
        .banner-text-group { display: flex; align-items: center; gap: 15px; }
        .banner-inline-vip i { font-size: 40px; }
        .banner-inline-vip h4 { font-size: 20px; margin-bottom: 5px; }
        .btn-banner-vip {
            background: #FFF;
            color: #075E54;
            padding: 10px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
            white-space: nowrap;
        }
        .btn-banner-vip:hover { background: #25D366; color: #FFF; }

        /* --- Paginação --- */
        .paginacao { text-align: center; margin-top: 40px; padding-bottom: 40px; }
        .pag-item {
            display: inline-block;
            padding: 10px 15px;
            margin: 0 5px;
            background: #1A1F71;
            color: #FFF;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s;
        }
        .pag-item.active, .pag-item:hover { background: #FFD700; color: #090122; font-weight: bold; }
        
        footer { text-align: center; padding: 20px; background: #090122; color: #777; font-size: 14px; border-top: 1px solid #1A1F71; }

        @media(min-width: 768px) {
            .topo { padding: 20px; }
            .topo h1 { font-size: 24px; }
            .blog-grid { 
                grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
                gap: 30px; 
            }
            .banner-inline-vip { grid-column: span 2; }
        }
        @media(min-width: 1024px) {
            .blog-grid { gap: 40px; }
            .banner-inline-vip { grid-column: span 3; }
        }
    </style>
</head>
<body>

<header class="topo">
    <a href="index.html" style="text-decoration:none;">
        <h1>🔍<span class="achado">AchadoCerto.</span><span class="vip">VIP</span></h1>
    </a>
    <input type="text" id="search-input" placeholder="Buscar">
</header>

<div class="blog-header">
    <h2>Últimas Matérias & Análises</h2>
    <p style="color:#CCC;">Fique por dentro das melhores dicas para economizar.</p>
</div>

<div class="container-principal">
    <div id="blog-lista" class="blog-grid">
        
        <!-- Posts serão carregados dinamicamente aqui -->

    </div>

    <div class="paginacao">
        <a href="#" class="pag-item active">1</a>
        <a href="#" class="pag-item">2</a>
        <a href="#" class="pag-item">3</a>
        <a href="#" class="pag-item"><i class="fas fa-chevron-right"></i></a>
    </div>
</div>

<footer>
    <p>© 2026 AchadoCerto.VIP — Todos os Direitos Reservados</p>
</footer>

<script src="script.js"></script>

</body>
</html>
